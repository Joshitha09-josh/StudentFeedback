<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Feedback System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #163a5c;
        }

        #thankYou {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background: #e8f5e9;
            border: 1px solid #4caf50;
            border-radius: 5px;
            text-align: center;
            color: #2e7d32;
        }

        #thankYou h3 {
            margin: 0 0 8px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Feedback System</h1>

        <form id="feedbackForm" onsubmit="showThankYou(event)">

            <label for="course">Course Name</label>
            <input
                type="text"
                id="course"
                name="course"
                placeholder="Enter course name"
                required
            >

            <label for="faculty">Faculty Name</label>
            <input
                type="text"
                id="faculty"
                name="faculty"
                placeholder="Enter faculty name"
                required
            >

            <label for="student">Student Name</label>
            <input
                type="text"
                id="student"
                name="student"
                placeholder="Enter student name"
                required
            >

            <label for="register">Register Number</label>
            <input
                type="text"
                id="register"
                name="register"
                placeholder="Enter register number"
                required
            >

            <label for="department">Department</label>
            <input
                type="text"
                id="department"
                name="department"
                placeholder="Enter department"
                required
            >

            <label for="rating">Rating</label>
            <select id="rating" name="rating" required>
                <option value="">Select Rating</option>
                <option value="5">Excellent - 5</option>
                <option value="4">Very Good - 4</option>
                <option value="3">Good - 3</option>
                <option value="2">Average - 2</option>
                <option value="1">Poor - 1</option>
            </select>

            <label for="feedback">Feedback / Comments</label>
            <textarea
                id="feedback"
                name="feedback"
                placeholder="Enter your feedback"
                required
            ></textarea>

            <button type="submit">
                Submit Feedback
            </button>

        </form>

        <!-- New Feature Added in Version 2 -->
        <div id="thankYou">

            <h3>Thank You!</h3>

            <p>
                Your feedback has been submitted successfully.
            </p>

            <p>
                We appreciate your valuable feedback.
            </p>

        </div>

    </div>

    <script>

        function showThankYou(event) {

            // Prevent page refresh
            event.preventDefault();

            // Display the new Thank-You feature
            document.getElementById("thankYou").style.display = "block";

            // Hide the form after submission
            document.getElementById("feedbackForm").style.display = "none";
        }

    </script>

</body>

</html>
