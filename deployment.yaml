apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-feedback

spec:
  replicas: 3

  selector:
    matchLabels:
      app: student-feedback

  template:
    metadata:
      labels:
        app: student-feedback

    spec:
      containers:
        - name: student-feedback

          image: balaji00002/student-feedback:v2

          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service

metadata:
  name: student-feedback-service

spec:
  type: NodePort

  selector:
    app: student-feedback

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081